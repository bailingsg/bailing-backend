# 本地开发基础设施：PostgreSQL
# 启动：npm run db:up   （在 bailing-backend 目录下执行）
# 说明：端口仅绑定 127.0.0.1，不暴露到局域网/公网。
name: bailingwooden-infra

services:
  postgres:
    image: postgres:17-alpine
    container_name: bailing-postgres
    restart: unless-stopped
    environment:
      # 仅显式传递 PostgreSQL 所需变量（值来自 --env-file 指定的 .env）
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
    name: bailing-postgres-data
